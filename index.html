<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#3d6a44" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Kindling" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kindling" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="One Kindling shift: run the shop, then deliver with ID checks. 9 AM–11 PM." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>Kindling</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #3d6a44;
        width: 100%;
        height: 100%;
        height: 100svh;
        height: 100dvh;
        position: fixed;
        inset: 0;
        touch-action: none;
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      :root,
      #kindling-shell {
        --kindling-safe-top: env(safe-area-inset-top, 0px);
        --kindling-safe-right: env(safe-area-inset-right, 0px);
        --kindling-safe-bottom: env(safe-area-inset-bottom, 0px);
        --kindling-safe-left: env(safe-area-inset-left, 0px);
      }
      /* Full visual viewport; shell.ts sizes children to a 16:9 stage + side rails. */
      #kindling-shell {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        touch-action: none;
        background: #3d6a44;
      }
      .kindling-rail {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        pointer-events: none;
        color: #f4e8c1;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        opacity: 0.88;
        box-sizing: border-box;
      }
      .kindling-rail[data-side="left"] {
        left: 0;
        padding-left: max(4px, var(--kindling-safe-left));
      }
      .kindling-rail[data-side="right"] {
        right: 0;
        padding-right: max(4px, var(--kindling-safe-right));
      }
      .kindling-rail[hidden] {
        display: none;
      }
      .kindling-rail span {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        transform: rotate(180deg);
        font-size: clamp(14px, 4.2vh, 28px);
        line-height: 1;
        white-space: nowrap;
      }
      #game-root {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        touch-action: none;
        background: #3d6a44;
      }
      /* Uniform scale: stage is sized to 16:9 by shell; canvas fills that box only. */
      #game-root canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
        image-rendering: auto;
        -webkit-user-drag: none;
      }
      #rotate-gate {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #3d6a44;
        color: #f4e8c1;
        font-family: Inter, system-ui, sans-serif;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        line-height: 1.35;
      }
      #rotate-gate[hidden] {
        display: none;
      }

      #install-coach {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 45;
        display: flex;
        justify-content: center;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }
      #install-coach[hidden] {
        display: none;
      }
      .install-coach__card {
        pointer-events: auto;
        max-width: 440px;
        width: 100%;
        background: #1c1612ee;
        color: #f4e8c1;
        border: 2px solid #3d6a44;
        border-radius: 14px;
        padding: 14px 16px;
        font-family: Inter, system-ui, sans-serif;
        box-shadow: 0 10px 30px #0008;
      }
      .install-coach__card strong {
        display: block;
        font-size: 16px;
        margin-bottom: 6px;
      }
      .install-coach__card p {
        margin: 0 0 12px;
        font-size: 14px;
        line-height: 1.35;
        color: #e8d9b8;
      }
      .install-coach__row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .install-coach__card button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        font: 700 14px Inter, system-ui, sans-serif;
        background: #b8ffb0;
        color: #1c1612;
        cursor: pointer;
      }
      .install-coach__card button.install-coach__ghost {
        background: transparent;
        color: #f4e8c1;
        border: 1px solid #f4e8c155;
      }
    </style>
  </head>
  <body>
    <div id="kindling-shell">
      <aside id="rail-left" class="kindling-rail" data-side="left" aria-hidden="true"><span>Kindling</span></aside>
      <div id="game-root"></div>
      <aside id="rail-right" class="kindling-rail" data-side="right" aria-hidden="true"><span>Kindling</span></aside>
    </div>
    <div id="rotate-gate" hidden aria-hidden="true">Turn your phone sideways to run Kindling.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
